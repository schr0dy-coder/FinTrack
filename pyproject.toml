[project]
name = "fintrack"
version = "1.0.0"
description = "Financial Transaction Monitoring & Fraud Detection Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg>=3.1.18",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "scikit-learn>=1.4.1",
    "joblib>=1.3.2",
    "streamlit>=1.32.0",
    "plotly>=5.20.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.2",
    "cryptography>=42.0.5",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib -p no:warnings"
testpaths = [
    "tests",
]
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"dashboard/**" = ["E402"]
